let wi=0,si=0;const states={};
function state(){const key=wi+'-'+si;return states[key]||(states[key]={spot:0,note:'',shown:false,visited:false});}
function render(){const w=works[wi],s=w.steps[si],st=state(),pic=pictures[wi],z=s.z[st.spot];
 $('.steps').innerHTML=steps.map((t,i)=>`<button class="step" type="button" data-step="${i}" aria-pressed="${si===i}">${i+1} ${t}${states[wi+'-'+i]?.visited?' ✓':''}</button>`).join('');
 $('.steps').querySelectorAll('button').forEach(b=>b.onclick=()=>{si=Number(b.dataset.step);render();});
 const img=$('.photo img');img.src=pic.src;img.alt='胡先民作品'+w.name+'原始照片';$('.photo').style.width=Math.min(430,520*pic.w/pic.h)+'px';$('.photo').style.maxWidth='100%';
 $('.hotspots').innerHTML=s.z.map((r,i)=>`<button type="button" class="hot" style="left:${(r.x+r.w/2)*100}%;top:${(r.y+r.h/2)*100}%" aria-label="观察点${i+1}：${r.label}" aria-pressed="${st.spot===i}">${i+1}</button>`).join('');
 $('.hotspots').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{st.spot=i;render();});
 $('.caption').textContent=w.name;$('#wo-heading').textContent=(si+1)+' / 4　'+steps[si];$('#wo-question').textContent=s.q;
 const svg=$('.detail');svg.setAttribute('viewBox',`${z.x*pic.w} ${z.y*pic.h} ${z.w*pic.w} ${z.h*pic.h}`);const detail=svg.querySelector('image');detail.setAttribute('href',pic.src);detail.setAttribute('width',pic.w);detail.setAttribute('height',pic.h);svg.setAttribute('aria-label',z.label+'原图局部');
 $('#wo-spot').textContent='观察点 '+(st.spot+1)+' · '+z.label;$('#wo-note').value=st.note;$('#wo-error').textContent='';
 $('#wo-feedback').hidden=!st.shown;$('#wo-feedback').innerHTML='<strong>参考分析 · '+z.label+'</strong><p>'+z.analysis+'</p><div class="muted">对照你的依据：是否说明了可见的形体关系？其他有证据的解释也可成立。</div>';
 $('#wo-reference').textContent=st.shown?'收起参考分析':'对照参考分析';$('#wo-next').textContent=si===3?'切换下一件作品 →':'下一步 →';
 $('#wo-progress').textContent='本作品已对照 '+steps.filter((_,i)=>states[wi+'-'+i]?.visited).length+' / 4 步';
}
$('select').onchange=e=>{wi=Number(e.target.value);si=0;render();};$('#wo-note').oninput=e=>{state().note=e.target.value;};
$('#wo-reference').onclick=()=>{const st=state();if(!st.shown&&st.note.trim().length<6){$('#wo-error').textContent='请先写一句观察依据（至少6个字），再对照参考分析。';$('#wo-note').focus();return;}st.shown=!st.shown;if(st.shown)st.visited=true;render();};
$('#wo-next').onclick=()=>{if(si<3)si++;else{wi=(wi+1)%works.length;si=0;$('select').value=wi;}render();};render();
})();
